name: Daily Product Refresh

on:
  schedule:
    - cron: '0 5 * * *'   # 5am UTC = 9am Gulf / 1am US-East
  workflow_dispatch:        # lets you click "Run workflow" in GitHub UI too

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install & build server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Generate fresh daily batch
        working-directory: server
        run: npm run research:daily -- --force

      - name: Commit & push updated dashboard
        run: |
          git config user.name  "az-finds-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/app/public/sample-dashboard.json sample-dashboard.json
          if git diff --cached --quiet; then
            echo "No changes – skipping commit"
          else
            git commit -m "chore: daily product refresh $(date -u +%Y-%m-%d)"
            git push
          fi
