[build]
  base    = "artifact/app"
  command = "npm run build"
  publish = "artifact/app/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — all paths serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security + allow MAXIMUS iframe embed
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Allow themaximus.netlify.app to be embedded here, and vice versa
    Content-Security-Policy = "frame-src https://themaximus.netlify.app; default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:;"
